<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A concise SQL reference for PostgreSQL learning."
    />
    <title>SQL Notebook — Quick Reference</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark-dimmed.min.css"
      referrerpolicy="no-referrer"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"
      defer
      referrerpolicy="no-referrer"
    ></script>
    <script src="script.js?v=999ced7" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <h1>SQL Notebook</h1>
        <p class="subtitle">
          A focused quick reference for querying, modeling, and optimizing data.
        </p>
      </div>
    </header>

    <main class="page-shell">
      <section class="toolbar" aria-label="Reference controls">
        <label class="search-field" for="search-input">
          <span class="sr-only">Search topics</span>
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="search-input"
            type="search"
            placeholder="Search topics…"
            autocomplete="off"
          />
        </label>
        <div class="action-buttons">
          <button type="button" id="expand-all">Expand All</button>
          <button type="button" id="collapse-all">Collapse All</button>
        </div>
      </section>

      <p id="results-count" class="results-count" aria-live="polite"></p>
      <section
        id="cheatsheet"
        class="cheatsheet"
        aria-label="SQL quick reference"
      ></section>
      <p id="empty-state" class="empty-state" hidden>
        No matching topics found.
      </p>
    </main>
  </body>
</html>
